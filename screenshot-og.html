<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #06060F;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .og-card {
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    gap: 60px;
    padding: 0 80px;
    background: linear-gradient(135deg, #06060F 0%, #0A0A18 50%, #08081A 100%);
    position: relative;
  }
  /* Subtle gradient overlay */
  .og-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(0,191,255,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(255,60,172,0.03) 0%, transparent 60%);
    pointer-events: none;
  }
  .strudel-side {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .strudel-svg {
    transform: rotate(45deg);
    filter: drop-shadow(0 0 30px rgba(0,191,255,0.15)) drop-shadow(0 0 30px rgba(255,23,68,0.12)) drop-shadow(0 0 30px rgba(168,85,247,0.12)) drop-shadow(0 0 30px rgba(255,230,0,0.10));
  }
  .text-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 9999px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid rgba(255,180,50,0.25);
    background: linear-gradient(135deg, #FFB432 0%, #FF3CAC 50%, #FF2D78 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 20px;
    width: fit-content;
  }
  .title {
    font-size: 42px;
    font-weight: 800;
    color: #fff;
    line-height: 1.15;
    margin-bottom: 12px;
  }
  .subtitle {
    font-size: 18px;
    color: #999;
    line-height: 1.4;
    margin-bottom: 28px;
  }
  .stats {
    display: flex;
    gap: 32px;
  }
  .stat {
    display: flex;
    flex-direction: column;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
  }
  .stat-label {
    font-size: 11px;
    color: #666;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .divider {
    width: 1px;
    height: 50px;
    background: rgba(255,255,255,0.08);
    align-self: center;
    flex-shrink: 0;
    margin: 0 -8px;
  }
</style>
</head>
<body>
<div class="og-card">
  <div class="strudel-side">
    <svg class="strudel-svg" width="360" height="360" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g-tl" cx="20" cy="20" r="280" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#00BFFF" />
          <stop offset="50%" stop-color="#00BFFF" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="g-tr" cx="260" cy="20" r="280" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FFE600" />
          <stop offset="50%" stop-color="#FFE600" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="g-br" cx="260" cy="260" r="280" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#A855F7" />
          <stop offset="50%" stop-color="#A855F7" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="g-bl" cx="20" cy="260" r="280" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FF1744" />
          <stop offset="50%" stop-color="#FF1744" stop-opacity="0" />
        </radialGradient>
        <mask id="vortex-mask">
          <rect width="280" height="280" fill="black" />
          <rect x="12"  y="12"  width="256" height="256" rx="38" fill="none" stroke="white" stroke-width="2.5" transform="rotate(0, 140, 140)" />
          <rect x="20"  y="20"  width="240" height="240" rx="36" fill="none" stroke="white" stroke-width="2.5" transform="rotate(4.5, 140, 140)" />
          <rect x="28"  y="28"  width="224" height="224" rx="34" fill="none" stroke="white" stroke-width="2.5" transform="rotate(9, 140, 140)" />
          <rect x="36"  y="36"  width="208" height="208" rx="31" fill="none" stroke="white" stroke-width="2.5" transform="rotate(13.5, 140, 140)" />
          <rect x="44"  y="44"  width="192" height="192" rx="29" fill="none" stroke="white" stroke-width="2.5" transform="rotate(18, 140, 140)" />
          <rect x="52"  y="52"  width="176" height="176" rx="26" fill="none" stroke="white" stroke-width="2.5" transform="rotate(22.5, 140, 140)" />
          <rect x="60"  y="60"  width="160" height="160" rx="24" fill="none" stroke="white" stroke-width="2.5" transform="rotate(27, 140, 140)" />
          <rect x="68"  y="68"  width="144" height="144" rx="22" fill="none" stroke="white" stroke-width="2.5" transform="rotate(31.5, 140, 140)" />
          <rect x="76"  y="76"  width="128" height="128" rx="19" fill="none" stroke="white" stroke-width="2.5" transform="rotate(36, 140, 140)" />
          <rect x="84"  y="84"  width="112" height="112" rx="17" fill="none" stroke="white" stroke-width="2.5" transform="rotate(40.5, 140, 140)" />
          <rect x="92"  y="92"  width="96"  height="96"  rx="14" fill="none" stroke="white" stroke-width="2.5" transform="rotate(45, 140, 140)" />
          <rect x="100" y="100" width="80"  height="80"  rx="12" fill="none" stroke="white" stroke-width="2.5" transform="rotate(49.5, 140, 140)" />
          <rect x="108" y="108" width="64"  height="64"  rx="10" fill="none" stroke="white" stroke-width="2.5" transform="rotate(54, 140, 140)" />
          <rect x="116" y="116" width="48"  height="48"  rx="7"  fill="none" stroke="white" stroke-width="2.5" transform="rotate(58.5, 140, 140)" />
          <rect x="124" y="124" width="32"  height="32"  rx="5"  fill="none" stroke="white" stroke-width="2.5" transform="rotate(63, 140, 140)" />
        </mask>
      </defs>
      <g mask="url(#vortex-mask)">
        <rect width="280" height="280" fill="url(#g-tl)" />
        <rect width="280" height="280" fill="url(#g-tr)" style="mix-blend-mode: screen" />
        <rect width="280" height="280" fill="url(#g-br)" style="mix-blend-mode: screen" />
        <rect width="280" height="280" fill="url(#g-bl)" style="mix-blend-mode: screen" />
      </g>
    </svg>
  </div>

  <div class="text-side">
    <div class="badge">AI Shift Drift</div>
    <h1 class="title">85% der Restaurants<br>unsichtbar f&uuml;r KI</h1>
    <p class="subtitle">AI-Readiness Report 2026<br>Deutschlands Gastronomie auf KI-Blindflug</p>
    <div class="stats">
      <div class="stat">
        <span class="stat-value" style="color: #6366f1;">85%</span>
        <span class="stat-label">KI-unsichtbar</span>
      </div>
      <div class="divider"></div>
      <div class="stat">
        <span class="stat-value" style="color: #FFE600;">0%</span>
        <span class="stat-label">Agent-ready</span>
      </div>
      <div class="divider"></div>
      <div class="stat">
        <span class="stat-value" style="color: #FF1744;">59%</span>
        <span class="stat-label">Google-Paradox</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
